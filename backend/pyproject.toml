[project]
name = "careerfit-ai"
version = "1.0.0"
description = "CareerFit AI backend API for resume skill gap analysis and job matching"
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "keybert>=0.8.0",
    "torch>=2.0.0",
    "pdfplumber>=0.10.0",
    "httpx>=0.26.0",
    "scrapling[fetchers]>=0.4.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "rank-bm25>=0.2.2",
    # Background jobs + caching
    "arq>=0.25",
    "redis[hiredis]>=5.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # Auth
    "PyJWT>=2.8",
    "bcrypt>=4.0.0",
    "email-validator>=2.0",
    # Monitoring
    "prometheus-fastapi-instrumentator>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-asyncio>=0.23.0"]
migrate = ["alembic>=1.13.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["app"]
